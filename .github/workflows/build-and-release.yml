name: Build, Test & Continuous Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & DSU Protocol Self-Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore .\HandheldGyroDSU.sln

      - name: Build Solution (Release)
        run: dotnet build .\HandheldGyroDSU.sln -c Release --no-restore /warnaserror

      - name: Run Automated Cemuhook DSU v1001 & IPC Self-Test
        run: dotnet run --project .\HandheldDsuServer.csproj -c Release --no-build -- --self-test

      - name: Package Portable ZIP & Standalone Single-File EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish" -Force | Out-Null

          # 1. Portable ZIP Archive (with visible folder structure, Locales, README, LICENSE, install.ps1)
          $zipStageDir = "publish/portable/HandheldGyroDSU"
          New-Item -ItemType Directory -Path $zipStageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $zipStageDir

          Copy-Item .\README.md -Destination $zipStageDir -Force
          Copy-Item .\LICENSE -Destination $zipStageDir -Force
          Copy-Item .\install.ps1 -Destination $zipStageDir -Force

          Compress-Archive -Path "$zipStageDir\*" -DestinationPath "publish/HandheldGyroDSU-win-x64.zip" -Force

          # 2. Standalone Single-File Executable (self-contained, zero extraction needed)
          $singleStageDir = "publish/single"
          New-Item -ItemType Directory -Path $singleStageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o $singleStageDir

          Copy-Item "$singleStageDir\HandheldGyroDSU.exe" -Destination "publish/HandheldGyroDSU.exe" -Force

          # 3. Generate SHA256SUMS.txt for transparency and integrity verification
          $zipHash = (Get-FileHash "publish/HandheldGyroDSU-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "publish/HandheldGyroDSU.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  HandheldGyroDSU-win-x64.zip",
            "$exeHash  HandheldGyroDSU.exe"
          ) | Set-Content -Path "publish/SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Build Artifacts (ZIP + Standalone EXE + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: HandheldGyroDSU-win-x64-packages
          path: |
            publish/HandheldGyroDSU-win-x64.zip
            publish/HandheldGyroDSU.exe
            publish/SHA256SUMS.txt

      - name: Publish Automatic Release on Push to Master
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HandheldGyroDSU v1.0.${{ github.run_number }} (Dev Build)
          make_latest: true
          generate_release_notes: true
          files: |
            publish/HandheldGyroDSU-win-x64.zip
            publish/HandheldGyroDSU.exe
            publish/SHA256SUMS.txt
