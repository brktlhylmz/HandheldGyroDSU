name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & DSU Protocol Self-Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore .\HandheldGyroDSU.sln

      - name: Build Solution (Release)
        run: dotnet build .\HandheldGyroDSU.sln -c Release --no-restore /warnaserror

      - name: Run Automated Cemuhook DSU v1001 & IPC Self-Test
        run: dotnet run --project .\HandheldDsuServer.csproj -c Release --no-build -- --self-test

      - name: Publish Standalone Single-File Executable (HandheldGyroDSU.exe)
        shell: pwsh
        run: |
          $outDir = "publish/single"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o $outDir

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandheldGyroDSU-win-x64-exe
          path: publish/single/HandheldGyroDSU.exe

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/single/HandheldGyroDSU.exe
          generate_release_notes: true
