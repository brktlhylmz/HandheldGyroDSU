name: Build, Test & Continuous Release

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & DSU Protocol Self-Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Determine Release Channel & Version
        id: meta
        shell: pwsh
        run: |
          $isBeta = "${{ github.ref }}" -eq "refs/heads/dev"
          $ver = "1.0.${{ github.run_number }}"
          if ($isBeta) {
            $tag = "v$ver-beta"
            $infoVer = "$ver-beta"
            $title = "HandheldGyroDSU $tag (Beta Pre-Release)"
            $prerelease = "true"
            $makeLatest = "false"
          } else {
            $tag = "v$ver"
            $infoVer = "$ver"
            $title = "HandheldGyroDSU $tag"
            $prerelease = "false"
            $makeLatest = "true"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "info_version=$infoVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $headSha = (git rev-parse HEAD).Trim()
          $masterSha = (git rev-parse origin/master 2>$null).Trim()
          $skipRelease = if ($isBeta -and $headSha -eq $masterSha) { "true" } else { "false" }
          "make_latest=$makeLatest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "skip_release=$skipRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Dependencies
        run: dotnet restore .\HandheldGyroDSU.sln

      - name: Build Solution (Release)
        run: dotnet build .\HandheldGyroDSU.sln -c Release --no-restore /warnaserror -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.info_version }}

      - name: Run Automated Cemuhook DSU v1001 & IPC Self-Test
        run: dotnet run --project .\HandheldDsuServer.csproj -c Release --no-build -- --self-test

      - name: Package Portable ZIP, Lightweight EXE & Self-Contained Standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish" -Force | Out-Null
          $ver = "${{ steps.meta.outputs.version }}"
          $infoVer = "${{ steps.meta.outputs.info_version }}"

          # 1. Portable ZIP Archive (~500 KB - transparent folder structure, Locales, README, LICENSE, install.ps1)
          $zipStageDir = "publish/portable/HandheldGyroDSU"
          New-Item -ItemType Directory -Path $zipStageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=false `
            -p:Version=$ver `
            -p:InformationalVersion=$infoVer `
            -o $zipStageDir

          Copy-Item .\README.md -Destination $zipStageDir -Force
          Copy-Item .\LICENSE -Destination $zipStageDir -Force
          Copy-Item .\install.ps1 -Destination $zipStageDir -Force

          Compress-Archive -Path "$zipStageDir\*" -DestinationPath "publish/HandheldGyroDSU-win-x64.zip" -Force

          # 2. Lightweight Single-File Executable (~500 KB - framework-dependent single .exe)
          $lightStageDir = "publish/lightweight"
          New-Item -ItemType Directory -Path $lightStageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=false `
            -p:PublishSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=$ver `
            -p:InformationalVersion=$infoVer `
            -o $lightStageDir

          Copy-Item "$lightStageDir\HandheldGyroDSU.exe" -Destination "publish/HandheldGyroDSU.exe" -Force

          # 3. Self-Contained Standalone Single-File Executable (~68 MB - includes full .NET 10 + WPF runtime)
          $standaloneStageDir = "publish/standalone"
          New-Item -ItemType Directory -Path $standaloneStageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=$ver `
            -p:InformationalVersion=$infoVer `
            -o $standaloneStageDir

          Copy-Item "$standaloneStageDir\HandheldGyroDSU.exe" -Destination "publish/HandheldGyroDSU-Standalone.exe" -Force

          # 4. Generate SHA256SUMS.txt for transparency and integrity verification
          $zipHash = (Get-FileHash "publish/HandheldGyroDSU-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $lightHash = (Get-FileHash "publish/HandheldGyroDSU.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $standaloneHash = (Get-FileHash "publish/HandheldGyroDSU-Standalone.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  HandheldGyroDSU-win-x64.zip",
            "$lightHash  HandheldGyroDSU.exe",
            "$standaloneHash  HandheldGyroDSU-Standalone.exe"
          ) | Set-Content -Path "publish/SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Build Artifacts (ZIP + Lightweight EXE + Standalone EXE + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: HandheldGyroDSU-win-x64-packages
          path: |
            publish/HandheldGyroDSU-win-x64.zip
            publish/HandheldGyroDSU.exe
            publish/HandheldGyroDSU-Standalone.exe
            publish/SHA256SUMS.txt

      - name: Publish Automatic Release (Stable on Master / Beta Pre-Release on Dev)
        if: github.event_name == 'push' && steps.meta.outputs.skip_release != 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            publish/HandheldGyroDSU-win-x64.zip
            publish/HandheldGyroDSU.exe
            publish/HandheldGyroDSU-Standalone.exe
            publish/SHA256SUMS.txt
