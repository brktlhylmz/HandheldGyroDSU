name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & DSU Protocol Self-Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore .\HandheldGyroDSU.sln

      - name: Build Solution (Release)
        run: dotnet build .\HandheldGyroDSU.sln -c Release --no-restore /warnaserror

      - name: Run Automated Cemuhook DSU v1001 & IPC Self-Test
        run: dotnet run --project .\HandheldDsuServer.csproj -c Release --no-build -- --self-test

      - name: Package Portable Release ZIP
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v1.0.0-ci" }
          $stageDir = "publish/HandheldGyroDSU-$version-win-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          dotnet publish .\HandheldDsuWidget\HandheldDsuWidget.csproj -c Release -r win-x64 --self-contained false -o $stageDir
          Copy-Item .\README.md -Destination $stageDir -Force
          Copy-Item .\LICENSE -Destination $stageDir -Force
          Copy-Item .\install.ps1 -Destination $stageDir -Force

          Compress-Archive -Path "$stageDir\*" -DestinationPath "publish/HandheldGyroDSU-$version-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandheldGyroDSU-win-x64
          path: publish/*.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.zip
          generate_release_notes: true
