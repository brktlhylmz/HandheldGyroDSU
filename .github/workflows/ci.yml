name: Pull Request & CI Verification

on:
  pull_request:
    branches: [ main, master, dev ]
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Dependencies
        run: dotnet restore .\HandheldGyroDSU.sln

      - name: Build Solution (Release with WarnAsError)
        run: dotnet build .\HandheldGyroDSU.sln -c Release --no-restore /warnaserror

      - name: Run Automated DSU, IPC & Locales Parity Self-Test
        run: dotnet run --project .\HandheldDsuServer.csproj -c Release --no-build -- --self-test
